[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pingpong-arm-rl"
version = "0.1.0"
description = "Experimental PPO training environment for a simulated table-tennis robot arm"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29,<1.2",
  "mujoco>=3.1,<4",
  "numpy>=1.24",
  "pygame>=2.1.3",
  "stable-baselines3>=2.3,<3",
  "tensorboard>=2.14",
  "torch>=2.1",
  "icecream>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["gymnasium_env"]
